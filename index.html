        </div>
        <div class="stats">
          <div class="stat">
            <b id="themeCount">0</b>
            <span id="themeCountLabel">тем</span>
          </div>
          <div class="stat">
            <b id="projectCount">0</b>
            <span id="projectCountLabel">проектов в теме</span>
          </div>
        </div>
      </div>

      <section id="projectsContainer" class="projects"></section>
    </main>
  </div>
